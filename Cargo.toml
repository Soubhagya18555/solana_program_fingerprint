[package]
name = "solana_program_fingerprint"
version = "0.1.0"
edition = "2021"
authors = ["Soubhagya"]
description = "Bytecode similarity engine for Solana programs"
license = "MIT"
readme = "README.md"
autotests = false

[[bin]]
name = "solana_program_fingerprint"
path = "src/main.rs"
test = false

[dependencies]
clap = { version = "4", features = ["derive"] }
goblin = "0.9"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "similarity_modules_test"
path = "tests/similarity_modules_test.rs"
